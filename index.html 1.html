<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Gateway</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .payment-box {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 95%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .order-summary {
            background: #f8f9fa;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
            text-align: left;
        }

        .order-summary h3 {
            margin-top: 0;
        }

        .order-summary p {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
        }

        .order-summary hr {
            border: none;
            border-top: 1px solid #ddd;
        }

        .payment-methods {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .payment-method {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            background: #fff;
        }

        .payment-method input {
            width: auto;
            margin-right: 5px;
        }

        #cardFields,
        #upiFields {
            margin-top: 10px;
        }

        #cardFields input,
        #upiFields input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 7px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        #cardFields input:focus,
        #upiFields input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 4px rgba(37, 99, 235, 0.2);
        }
    </style>
</head>

<body>

    <div class="payment-box">
        <h1>💳 PayEase</h1>

<p style="font-size: 13px; color: #888;">
    Simple & Secure Payment
</p>


        <div class="order-summary">
            <h3>Order Summary</h3>

            <p>
                <span>Product</span>
                <span>₹499</span>
            </p>

            <hr>

            <p>
                <strong>Total</strong>
                <strong style="font-size: 20px; color: #2563eb;">₹499</strong>
            </p>
        </div>

        <p>Enter your payment details</p>

       <p style="font-size: 13px; color: #777;">
    🔒 Your payment information is secure
</p>

<p style="font-size: 12px; color: #999;">
    🧪 Demo payment only — no real money is charged.
</p>
        <h3>Choose Payment Method</h3>

        <div class="payment-methods">

            <label class="payment-method">
                <input
                    type="radio"
                    name="payment"
                    value="card"
                    checked
                    onclick="showCard()"
                >
                💳 Card
            </label>

            <label class="payment-method">
                <input
                    type="radio"
                    name="payment"
                    value="upi"
                    onclick="showUPI()"
                >
                📱 UPI
            </label>

        </div>

        <div id="cardFields">

            <input
                type="text"
                placeholder="Cardholder Name"
            >

            <input
                type="text"
                id="cardNumber"
                placeholder="Card Number"
                maxlength="19"
                oninput="formatCardNumber()"
            >

            <input
                type="text"
                id="expiry"
                placeholder="Expiry Date (MM/YY)"
                maxlength="5"
                oninput="formatExpiry()"
            >

            <input
                type="password"
                id="cvv"
                placeholder="CVV"
                maxlength="3"
                inputmode="numeric"
                oninput="this.value = this.value.replace(/\D/g, '')"
            >

        </div>

        <div id="upiFields" style="display: none;">

            <input
                type="text"
                id="upiId"
                placeholder="Enter UPI ID"
            >

            <p style="font-size: 12px; color: #888;">
                Example: test@upi
            </p>

        </div>

        <button onclick="makePayment()">
            Pay Securely ₹499
        </button>

    </div>


    <script>

        function makePayment() {

            const paymentMethod =
                document.querySelector(
                    'input[name="payment"]:checked'
                ).value;

            if (paymentMethod === "card") {

                const cardName =
                    document.querySelector(
                        '#cardFields input:nth-child(1)'
                    ).value.trim();

                const cardNumber =
                    document.querySelector(
                        '#cardFields input:nth-child(2)'
                    ).value.replace(/\s/g, "");

                const expiry =
                    document.querySelector(
                        '#cardFields input:nth-child(3)'
                    ).value.trim();

                const cvv =
                    document.querySelector(
                        '#cardFields input:nth-child(4)'
                    ).value.trim();


                if (cardName === "") {
                    alert("Please enter the cardholder name.");
                    return;
                }


                if (!/^\d{16}$/.test(cardNumber)) {
                    alert("Card number must contain exactly 16 digits.");
                    return;
                }


                if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(expiry)) {
                    alert("Expiry date must be in MM/YY format.");
                    return;
                }


                if (!/^\d{3}$/.test(cvv)) {
                    alert("CVV must contain exactly 3 digits.");
                    return;
                }

            } else {

                const upiInput =
                    document.querySelector("#upiFields input");

                const upi =
                    upiInput.value.trim();


                if (upi === "") {
                    alert("Please enter your UPI ID.");
                    return;
                }


                if (!/^[a-zA-Z0-9._-]+@[a-zA-Z0-9]+$/.test(upi)) {
                    alert("Please enter a valid UPI ID.");
                    return;
                }
            }


            document.querySelector(".payment-box").innerHTML = `
                <h1>⏳ Processing Payment...</h1>
                <p>Please wait...</p>
            `;


            const transactionId =
                "TXN" + Math.floor(Math.random() * 900000 + 100000);


            setTimeout(function() {

                document.querySelector(".payment-box").innerHTML = `
                    <h1>✅ Payment Successful</h1>

                    <p>Your payment of ₹499 was successful.</p>

                    <p>
                        <strong>Transaction ID:</strong>
                        ${transactionId}
                    </p>

                    <button onclick="location.reload()">
                        Make Another Payment
                    </button>
                `;

            }, 2000);
        }


        function showCard() {

            document.getElementById("cardFields")
                .style.display = "block";

            document.getElementById("upiFields")
                .style.display = "none";
        }


        function showUPI() {

            document.getElementById("cardFields")
                .style.display = "none";

            document.getElementById("upiFields")
                .style.display = "block";
        }


        function formatCardNumber() {

            const input =
                document.getElementById("cardNumber");

            let value =
                input.value.replace(/\D/g, "");

            value =
                value.substring(0, 16);

            value =
                value.replace(/(.{4})/g, "$1 ").trim();

            input.value = value;
        }


        function formatExpiry() {

            const input =
                document.getElementById("expiry");

            let value =
                input.value.replace(/\D/g, "");

            value =
                value.substring(0, 4);

            if (value.length > 2) {

                value =
                    value.substring(0, 2)
                    + "/"
                    + value.substring(2);
            }

            input.value = value;
        }

    </script>

</body>
</html>
